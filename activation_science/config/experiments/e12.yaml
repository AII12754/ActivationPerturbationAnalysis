# E12: Integrated Trigram Delta-Coding Pipeline
trigram_pipeline:
  layer_boundary: 6
  group_size: 128
  top_k: 1
  int8_group_size: 128
  int8_residual: true
  residual_top_k: 1
  activation_dtype: "float16"
  ngram_batch_size: 128
  table_mode: "cold"      # "cold" = empty start, "warm" = seed from first prompt
  table_update_mode: "sequence_extract"  # "sequence_extract" (reuse prefill) or "trigram_forward" (separate 3-token fwd)
  table_dtype: "float16"                # "float16" (default) or "float8_e4m3fn" to halve per-entry memory
  max_table_entries: 0                   # 0 = unlimited (default), >0 = LRU eviction cap
  # DAG trie: dag[A][B] -> (bigram_hidden, {C: trigram_hidden})

sweep:
  context_lengths: [512, 2048]
  num_prompts_per_length: 100   # 50 warmup + 50 test — table grows across requests

storage:
  output_dir: "./results_trigram_pipeline"

logging:
  log_file: "./results_trigram_pipeline/experiment.log"
