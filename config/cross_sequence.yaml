# ============================================================
# Cross-Sequence Alignment — Configuration
# ============================================================
# Tests whether different prompts that produce similar outputs
# use similar internal representations. Measures per-layer CKA,
# Procrustes distance, subspace overlap, centroid cosine, and
# shared-token cosine across prompt pairs.

# --- Model ---------------------------------------------------
model:
  path: "/root/share/models/Qwen2.5-32B-Instruct"
  dtype: "bfloat16"
  max_memory_per_gpu_gb: 75
  trust_remote_code: true

# --- GPU scheduling ------------------------------------------
gpu:
  min_free_memory_gb: 40
  overhead_factor: 1.25

# --- Cross-sequence parameters --------------------------------
cross_sequence:
  context_length: 512       # default for cross-dataset pairs
  subspace_k: 10
  activation_dtype: "float32"

# --- Sweep parameters ----------------------------------------
sweep:
  context_lengths:
    - 256
    - 512
    - 1024
  num_prompts_per_length: 3

# --- Prompt generation ---------------------------------------
prompts:
  source: "dataset"
  dataset_name: "/root/share/dataset/wikitext-2-raw-v1"
  dataset_config: "default"
  dataset_split: "test"
  seed: 42
  num_prompt_candidates: 50
  datasets:
    - "/root/share/dataset/wikitext-2-raw-v1"
    - "/root/share/dataset/cnndn"
    - "/root/share/dataset/xsum"
    - "/root/share/dataset/alpaca"
    - "/root/share/dataset/gsm8k"
    - "/root/share/dataset/trivia_qa-rc"
    - "/root/share/dataset/ShareGPT52K"

# --- Result storage ------------------------------------------
storage:
  output_dir: "./results_cross_sequence"
  format: "parquet"
  checkpoint_every: 5

# --- Logging -------------------------------------------------
logging:
  level: "INFO"
  log_file: "./results_cross_sequence/experiment.log"
