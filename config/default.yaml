# ============================================================
# Activation Perturbation Analysis — Default Configuration
# ============================================================

# --- Model ---------------------------------------------------
model:
  path: "/path/to/your/model"          # local HuggingFace model directory
  dtype: "float16"                      # float16 | bfloat16 | float32
  max_memory_per_gpu_gb: 75            # leave headroom on 80 GB A100s
  trust_remote_code: false

# --- GPU scheduling ------------------------------------------
gpu:
  min_free_memory_gb: 40               # skip GPUs with less free VRAM
  max_parallel_experiments: 4           # cap on concurrent experiment workers
  detect_automatically: true            # auto-detect via pynvml

# --- Experiment sweep ----------------------------------------
sweep:
  context_lengths:
    - 256
    - 512
    - 1024
    - 2048
    - 4096
    - 8192
    - 16384

  perturbation_positions:               # fraction of context length
    - 0.10
    - 0.20
    - 0.80
    - 0.90

  perturbation_span_lengths:            # in tokens
    - 8
    - 32
    - 128
    - 512

  perturbation_types:
    - "random_replace"
    - "mask"
    - "delete"
    - "compress"
    - "paraphrase"
    - "semantic_change"

# --- Distance-based measurement -----------------------------
measurement:
  immediate_window: 10                  # first N tokens after perturbation
  short_window: 100                     # first N tokens after perturbation
  periodic_sampling_step: 100           # sample every N tokens
  periodic_sampling_width: 10           # width of each sampling window

# --- Prompt generation --------------------------------------
prompts:
  source: "dataset"                     # "dataset" | "template"
  dataset_name: "wikitext"              # HuggingFace dataset id
  dataset_config: "wikitext-103-raw-v1"
  dataset_split: "train"
  seed: 42
  num_prompt_candidates: 50             # preload this many long passages

# --- Result storage -----------------------------------------
storage:
  output_dir: "./results"
  format: "parquet"                     # parquet | csv
  checkpoint_every: 10                  # checkpoint after N experiments

# --- Logging ------------------------------------------------
logging:
  level: "INFO"                         # DEBUG | INFO | WARNING
  log_file: "./results/experiment.log"
